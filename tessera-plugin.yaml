# Loctek desk: a Loctek Motion or Flexispot desk on the screen, through the entities of the LoctekMotion package.
# Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: loctek_desk
version: 0.1.0
api: "0.24"
icon: desk
maintainer: Orishas
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 28   # the code, and the two masks of Sit and Stand: 2 x 64 x 64 bytes, 8 KB

permissions:
  home_assistant_actions: [cover.open_cover, cover.close_cover, cover.stop_cover, button.press, switch.turn_on]

tiles:
  - id: desk
    name: tile_name
    icon: desk
    sizes: { min: 1x1, max: 2x2 }
    # The block (value, unit, bar, note) and up to nine keys (block, icon or word, word), with members (texts, layout,
    # motion); Sit and Stand draw an image of their mask where another key has its icon label, and keep the masks'
    # descriptors, about 100 bytes more. Not in it: the two masks at their key's size, the side squared in bytes each
    # (an icon is at most 128 pixels a side). A board with PSRAM keeps the masks there, outside what this number
    # counts; a board without keeps them inside the chip.
    memory: 4100
    domains: [cover]
    attributes: [current_position]
    example: tile_example
    preview: { title: "{name}", value: "{current_position} %" }
    options:
      - { id: height, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: height, hint: height_hint }
      - { id: sit, kind: entity, domains: [button], label: sit, hint: sit_hint }
      - { id: stand, kind: entity, domains: [button], label: stand, hint: stand_hint }
      - { id: preset_1, kind: entity, domains: [button], label: preset_1, hint: preset_hint }
      - { id: preset_2, kind: entity, domains: [button], label: preset_2, hint: preset_hint }
      - { id: child_lock, kind: entity, domains: [switch], label: child_lock, hint: child_lock_hint }
      - { id: alarm, kind: entity, domains: [button, switch], label: alarm, hint: alarm_hint }
      - { id: manual, kind: toggle, default: true, label: manual, hint: manual_hint }
